[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"
optimizer = true
optimizer_runs = 200
gas_limit = 10000000000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
arc-testnet = "https://rpc.testnet.arc.network"
arc-mainnet = "https://rpc.mainnet.arc.io"
